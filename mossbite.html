<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MOSSBITE</title>
<style>
  :root{
    --moss-900:#12160f;
    --moss-800:#1c2317;
    --moss-700:#2a3322;
    --panel:rgba(18,22,14,0.78);
    --panel-edge:rgba(232,230,214,0.10);
    --ink:#eae6d6;
    --ink-dim:#b9b6a2;
    --amber:#f2b84b;
    --moss-accent:#9fd356;
    --danger:#e2574c;
    --player:#2dd4bf;
    --bot1:#ff6b6b;
    --bot2:#a78bfa;
    --bot3:#fbbf24;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--moss-900);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    touch-action:none;
    overscroll-behavior:none;
  }
  #gameCanvas{
    position:absolute; inset:0; display:block; width:100%; height:100%;
    background:var(--moss-900);
  }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; inset:0; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  #topBar{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(10px + env(safe-area-inset-top)) 12px 0 12px;
    gap:10px;
  }
  #boardWrap{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:8px 10px;
    backdrop-filter:blur(6px);
    min-width:150px;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
  }
  #boardTitle{
    font-size:10px; letter-spacing:0.14em; color:var(--ink-dim);
    margin-bottom:6px; font-weight:600;
  }
  .rowScore{
    display:flex; align-items:center; gap:7px;
    font-size:13px; padding:2px 0; white-space:nowrap;
  }
  .rowScore .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 6px currentColor;}
  .rowScore .nm{flex:1; color:var(--ink); font-weight:500;}
  .rowScore .sc{color:var(--ink-dim); font-variant-numeric:tabular-nums; font-weight:600;}
  .rowScore.me .nm{color:var(--player);}

  #goalPill{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:999px;
    padding:7px 14px;
    font-size:12px;
    color:var(--ink-dim);
    backdrop-filter:blur(6px);
    white-space:nowrap;
  }
  #goalPill b{color:var(--amber); font-weight:700;}

  #rightTopCol{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  #soundToggle{
    pointer-events:auto;
    background:var(--panel); border:1px solid var(--panel-edge);
    border-radius:999px; width:34px; height:34px; font-size:15px;
    color:var(--ink); cursor:pointer; backdrop-filter:blur(6px);
  }

  #toast{
    position:absolute; top:14%; left:50%; transform:translate(-50%,-8px);
    background:var(--panel); border:1px solid var(--panel-edge);
    padding:10px 18px; border-radius:12px; font-size:14px;
    opacity:0; transition:opacity .25s ease, transform .25s ease;
    pointer-events:none; text-align:center; backdrop-filter:blur(6px);
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}

  #minimapWrap{
    position:absolute; right:12px; bottom:calc(150px + env(safe-area-inset-bottom));
    width:104px; height:104px; border-radius:50%;
    background:var(--panel); border:1px solid var(--panel-edge);
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  #minimapCanvas{width:100%; height:100%; display:block;}

  /* ---------- Screens ---------- */
  .screen{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, #223018 0%, #10140c 78%);
    z-index:20; padding:24px;
  }
  .screenCard{
    width:100%; max-width:380px; text-align:center;
  }
  .logo{
    font-size:44px; font-weight:800; letter-spacing:0.03em; color:var(--ink);
    margin:0 0 4px 0; line-height:1;
  }
  .logo span{color:var(--moss-accent);}
  .tagline{
    color:var(--ink-dim); font-size:14px; margin:0 0 30px 0; letter-spacing:0.01em;
  }
  .screenCardWide{max-width:400px;}
  #previewCanvas{
    display:block; margin:0 auto 18px auto; width:240px; height:104px;
  }
  .optBlock{ text-align:left; margin-bottom:18px; }
  .optLabel{
    font-size:12px; letter-spacing:0.06em; color:var(--ink-dim);
    margin-bottom:8px; font-weight:600;
  }
  .swatchRow{ display:flex; flex-wrap:wrap; gap:9px; }
  .swatch{
    width:30px; height:30px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; box-shadow:0 2px 6px rgba(0,0,0,0.3);
    transition:transform .12s ease, border-color .12s ease;
  }
  .swatch.selected{ border-color:#fff; transform:scale(1.12); }
  .styleRow{ display:flex; flex-wrap:wrap; gap:8px; }
  .styleBtn{
    flex:1 1 auto; min-width:72px; padding:9px 6px; text-align:center;
    background:rgba(255,255,255,0.04); border:1.5px solid var(--panel-edge);
    border-radius:10px; color:var(--ink-dim); font-size:11px; font-weight:600;
    cursor:pointer; transition:border-color .12s ease, color .12s ease;
  }
  .styleBtn .shapeIcon{
    width:20px; height:20px; margin:0 auto 5px auto; background:var(--moss-accent);
    border-radius:50%;
  }
  .styleBtn[data-style="viper"] .shapeIcon{ border-radius:4px; transform:rotate(45deg); }
  .styleBtn[data-style="cobra"] .shapeIcon{ border-radius:50%/35%; width:26px; }
  .styleBtn[data-style="horned"] .shapeIcon{
    border-radius:50%; position:relative;
  }
  .styleBtn[data-map="grass"] .shapeIcon{ background:linear-gradient(160deg,#6fae4a,#3f6b30); }
  .styleBtn[data-map="rocky"] .shapeIcon{ background:linear-gradient(160deg,#9c9284,#6b6255); border-radius:6px; }
  .styleBtn[data-map="snow"] .shapeIcon{ background:linear-gradient(160deg,#ffffff,#bcd3e2); }
  .styleBtn[data-map="space"] .shapeIcon{ background:radial-gradient(circle at 35% 30%, #7a5fc4, #0d0a1a 70%); }
  .styleBtn.selected{ border-color:var(--moss-accent); color:var(--ink); }
  .photoRow{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .photoBtn{
    padding:9px 14px; background:rgba(255,255,255,0.04); border:1.5px solid var(--panel-edge);
    border-radius:10px; color:var(--ink-dim); font-size:12px; font-weight:600;
    cursor:pointer; transition:border-color .12s ease, color .12s ease;
  }
  .photoBtn.selected{ border-color:var(--amber); color:var(--ink); }
  .photoStatus{ font-size:11px; color:var(--ink-dim); }
  .slider{
    -webkit-appearance:none; width:100%; height:6px; border-radius:3px;
    background:rgba(255,255,255,0.12); outline:none;
  }
  .slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #dff5e6, var(--moss-accent) 70%);
    cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.4);
  }
  .slider::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%; border:none;
    background:radial-gradient(circle at 35% 30%, #dff5e6, var(--moss-accent) 70%);
    cursor:pointer;
  }
  #startBtn, #retryBtn{
    width:100%; padding:16px; border:none; border-radius:14px;
    background:linear-gradient(180deg, #b6de6f, #8fc34a);
    color:#182408; font-size:17px; font-weight:700; letter-spacing:0.01em;
    box-shadow:0 8px 20px rgba(159,211,86,0.25);
    cursor:pointer;
  }
  #startBtn:active, #retryBtn:active{transform:translateY(1px);}
  .hint{margin-top:16px; font-size:12px; color:var(--ink-dim); line-height:1.5;}
  #endScreen{display:none;}
  .endTitle{font-size:15px; letter-spacing:0.14em; color:var(--ink-dim); margin-bottom:6px; font-weight:600;}
  .winnerName{font-size:32px; font-weight:800; margin-bottom:26px;}
  .finalBoard{margin-bottom:26px; text-align:left; background:var(--panel); border:1px solid var(--panel-edge); border-radius:14px; padding:12px 14px;}

  #deathFlash{
    position:absolute; inset:0; background:var(--danger); opacity:0; pointer-events:none;
    transition:opacity .12s ease;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="deathFlash"></div>

<div id="hud">
  <div id="topBar">
    <div id="boardWrap">
      <div id="boardTitle">LEADERBOARD</div>
      <div id="board"></div>
    </div>
    <div id="rightTopCol">
      <div id="goalPill">First to <b>100</b> wins</div>
      <button id="soundToggle" type="button" aria-label="Toggle sound">🔊</button>
    </div>
  </div>

  <div id="minimapWrap"><canvas id="minimapCanvas" width="104" height="104"></canvas></div>
</div>

<div id="toast"></div>

<div class="screen" id="startScreen">
  <div class="screenCard screenCardWide">
    <div class="logo">MOSS<span>BITE</span></div>
    <p class="tagline">Free-roam snake. Eat, grow, don't get bitten.</p>

    <canvas id="previewCanvas" width="240" height="104"></canvas>

    <div class="optBlock">
      <div class="optLabel">Body color</div>
      <div class="swatchRow" id="colorRow"></div>
    </div>

    <div class="optBlock">
      <div class="optLabel">Head style</div>
      <div class="styleRow" id="headRow"></div>
      <div class="photoRow">
        <button type="button" id="photoHeadBtn" class="photoBtn">📷 Use a Photo</button>
        <span id="photoHeadStatus" class="photoStatus"></span>
        <input type="file" id="headPhotoInput" accept="image/*" capture="environment" style="display:none">
      </div>
    </div>

    <div class="optBlock">
      <div class="optLabel">Map</div>
      <div class="styleRow" id="mapRow"></div>
    </div>

    <div class="optBlock">
      <div class="optLabel">Enemies: <span id="enemyCountLabel">3</span></div>
      <input type="range" id="enemyCount" min="1" max="50" value="3" class="slider">
    </div>

    <button id="startBtn">SLITHER IN</button>
    <p class="hint">Press and drag anywhere to steer, or use arrow keys<br>Bite yourself or a rival and you're back to a hatchling</p>
  </div>
</div>

<div class="screen" id="endScreen">
  <div class="screenCard">
    <div class="endTitle">WINNER</div>
    <div class="winnerName" id="winnerName">—</div>
    <div class="finalBoard" id="finalBoard"></div>
    <button id="retryBtn">SLITHER IN AGAIN</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================== SETUP ============================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mmCanvas = document.getElementById('minimapCanvas');
const mmCtx = mmCanvas.getContext('2d');

let viewW = window.innerWidth, viewH = window.innerHeight;
let DPR = Math.min(window.devicePixelRatio || 1, 2);

function resizeCanvas(){
  viewW = window.innerWidth; viewH = window.innerHeight;
  canvas.width = viewW * DPR; canvas.height = viewH * DPR;
  canvas.style.width = viewW+'px'; canvas.style.height = viewH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// World is fixed at 4x the display AREA (2x width, 2x height) captured at first load.
const WORLD_W = Math.max(viewW,700) * 2;
const WORLD_H = Math.max(viewH,500) * 2;

/* ============================== UTIL ============================== */
function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function dist2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }
function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }
function angDiff(a,b){ let d=(b-a+Math.PI*3)%(Math.PI*2)-Math.PI; return d; }
function hash2(x,y){
  let n = Math.sin(x*127.1 + y*311.7) * 43758.5453;
  return n - Math.floor(n);
}

/* ============================== SOUND ============================== */
// Small synthesized sound engine (oscillators + gain envelopes) — no audio
// files to embed, and it works entirely offline. AudioContext requires a
// user gesture to start, so it's created lazily on the first tap/click.
let audioCtx = null;
let soundOn = true;
function ensureAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// One short tone: freq -> freqEnd over duration, with a quick attack and
// an exponential decay so nothing clicks or lingers.
function playTone(freq, duration, type, gainAmt, freqEnd, delay){
  if(!soundOn) return;
  const ac = ensureAudio();
  if(!ac) return;
  const t0 = ac.currentTime + (delay||0);
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  if(freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd), t0+duration);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(gainAmt, t0+Math.min(0.02,duration*0.3));
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(t0);
  osc.stop(t0+duration+0.02);
}
const sfx = {
  eat(){ playTone(520, 0.09, 'sine', 0.18, 880); },
  boost(){
    playTone(440, 0.09, 'square', 0.12, 660, 0);
    playTone(660, 0.09, 'square', 0.12, 990, 0.07);
    playTone(880, 0.14, 'square', 0.14, 1320, 0.14);
  },
  death(){ playTone(220, 0.4, 'sawtooth', 0.16, 60); },
  mole(){ playTone(140, 0.16, 'sine', 0.10, 90); },
  invis(){
    playTone(700, 0.22, 'sine', 0.11, 340, 0);
    playTone(500, 0.22, 'sine', 0.07, 240, 0.06);
  },
  win(){
    [523,659,784,1046].forEach((f,i)=> playTone(f, 0.18, 'triangle', 0.16, null, i*0.11));
  },
  lose(){ playTone(180, 0.5, 'sine', 0.12, 70); }
};

/* ============================== PROCEDURAL TEXTURES ============================== */
// Small seamless-ish tileable canvases used as canvas fill patterns, so the
// ground reads as continuous organic texture instead of a grid of flat-
// colored tiles. Drawn once at load and reused every frame via createPattern.
function makeTexture(size, draw){
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  draw(c.getContext('2d'), size);
  return c.getContext('2d').createPattern(c, 'repeat');
}
// Draws at (x,y) plus wrapped copies near the tile edges so the pattern
// doesn't show a hard seam where it repeats.
function wrappedDraw(tctx, size, x, y, pad, draw){
  for(let ox=-1; ox<=1; ox++){
    for(let oy=-1; oy<=1; oy++){
      const wx = x+ox*size, wy = y+oy*size;
      if(wx>-pad && wx<size+pad && wy>-pad && wy<size+pad) draw(tctx, wx, wy);
    }
  }
}
const grassPattern = makeTexture(160, (tctx, size)=>{
  tctx.fillStyle = '#4b7a3c';
  tctx.fillRect(0,0,size,size);
  for(let i=0;i<460;i++){
    const x = Math.random()*size, y = Math.random()*size, r = 1+Math.random()*2.4;
    const dark = Math.random()>0.5;
    wrappedDraw(tctx, size, x, y, r, (c,wx,wy)=>{
      c.fillStyle = dark ? 'rgba(58,98,46,0.5)' : 'rgba(96,146,68,0.5)';
      c.beginPath(); c.arc(wx,wy,r,0,Math.PI*2); c.fill();
    });
  }
  for(let i=0;i<110;i++){
    const x = Math.random()*size, y = Math.random()*size, len = 4+Math.random()*5;
    const ang = -Math.PI/2 + (Math.random()-0.5);
    wrappedDraw(tctx, size, x, y, len, (c,wx,wy)=>{
      c.strokeStyle = 'rgba(154,204,112,0.4)';
      c.lineWidth = 1.3;
      c.beginPath(); c.moveTo(wx,wy); c.lineTo(wx+Math.cos(ang)*len, wy+Math.sin(ang)*len); c.stroke();
    });
  }
});
const rockPattern = makeTexture(140, (tctx, size)=>{
  tctx.fillStyle = '#7d766a';
  tctx.fillRect(0,0,size,size);
  for(let i=0;i<300;i++){
    const x = Math.random()*size, y = Math.random()*size, r = 1+Math.random()*3.2;
    const dark = Math.random()>0.5;
    wrappedDraw(tctx, size, x, y, r, (c,wx,wy)=>{
      c.fillStyle = dark ? 'rgba(64,58,49,0.42)' : 'rgba(158,150,134,0.42)';
      c.beginPath(); c.arc(wx,wy,r,0,Math.PI*2); c.fill();
    });
  }
  for(let i=0;i<40;i++){
    const x = Math.random()*size, y = Math.random()*size, len = 5+Math.random()*10;
    const ang = Math.random()*Math.PI*2;
    wrappedDraw(tctx, size, x, y, len, (c,wx,wy)=>{
      c.strokeStyle = 'rgba(45,40,34,0.35)';
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(wx,wy); c.lineTo(wx+Math.cos(ang)*len, wy+Math.sin(ang)*len); c.stroke();
    });
  }
});
const dirtPattern = makeTexture(120, (tctx, size)=>{
  tctx.fillStyle = '#6b5138';
  tctx.fillRect(0,0,size,size);
  for(let i=0;i<260;i++){
    const x = Math.random()*size, y = Math.random()*size, r = 1+Math.random()*3;
    const dark = Math.random()>0.5;
    wrappedDraw(tctx, size, x, y, r, (c,wx,wy)=>{
      c.fillStyle = dark ? 'rgba(44,32,20,0.45)' : 'rgba(122,96,66,0.45)';
      c.beginPath(); c.arc(wx,wy,r,0,Math.PI*2); c.fill();
    });
  }
  for(let i=0;i<30;i++){
    const x = Math.random()*size, y = Math.random()*size, r = 1+Math.random()*1.6;
    wrappedDraw(tctx, size, x, y, r, (c,wx,wy)=>{
      c.fillStyle = 'rgba(30,22,14,0.5)';
      c.beginPath(); c.arc(wx,wy,r,0,Math.PI*2); c.fill();
    });
  }
});
const snowPattern = makeTexture(160, (tctx, size)=>{
  tctx.fillStyle = '#e8eef2';
  tctx.fillRect(0,0,size,size);
  for(let i=0;i<420;i++){
    const x = Math.random()*size, y = Math.random()*size, r = 1+Math.random()*2.2;
    const dark = Math.random()>0.5;
    wrappedDraw(tctx, size, x, y, r, (c,wx,wy)=>{
      c.fillStyle = dark ? 'rgba(196,212,224,0.5)' : 'rgba(255,255,255,0.65)';
      c.beginPath(); c.arc(wx,wy,r,0,Math.PI*2); c.fill();
    });
  }
  for(let i=0;i<70;i++){
    const x = Math.random()*size, y = Math.random()*size, len = 3+Math.random()*4;
    const ang = Math.random()*Math.PI*2;
    wrappedDraw(tctx, size, x, y, len, (c,wx,wy)=>{
      c.strokeStyle = 'rgba(168,196,216,0.4)';
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(wx,wy); c.lineTo(wx+Math.cos(ang)*len, wy+Math.sin(ang)*len); c.stroke();
    });
  }
});
const spacePattern = makeTexture(200, (tctx, size)=>{
  tctx.fillStyle = '#0d0a1a';
  tctx.fillRect(0,0,size,size);
  for(let i=0;i<6;i++){
    const x = Math.random()*size, y = Math.random()*size, r = 30+Math.random()*50;
    const purple = Math.random()>0.5;
    wrappedDraw(tctx, size, x, y, r, (c,wx,wy)=>{
      const g = c.createRadialGradient(wx,wy,0,wx,wy,r);
      g.addColorStop(0, purple ? 'rgba(130,90,190,0.14)' : 'rgba(70,110,190,0.14)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(wx,wy,r,0,Math.PI*2); c.fill();
    });
  }
  for(let i=0;i<240;i++){
    const x = Math.random()*size, y = Math.random()*size, r = 0.3+Math.random()*1.5;
    const bright = 0.3+Math.random()*0.7;
    wrappedDraw(tctx, size, x, y, r, (c,wx,wy)=>{
      c.fillStyle = `rgba(255,255,255,${bright})`;
      c.beginPath(); c.arc(wx,wy,r,0,Math.PI*2); c.fill();
    });
  }
});

/* ============================== TERRAIN ============================== */
// Per-map look: which ground texture is the base, which (optional) texture
// blends in as accent patches, how likely each patch is to grow a solid
// obstacle cluster, what tint (if any) recolors those obstacles, and
// whether moles are native to this biome at all.
const MAP_CONFIGS = {
  grass: { label:'Grass', ground:()=>grassPattern, patch:()=>rockPattern, obstacleChance:0.35, obstacleTint:null, moles:true },
  rocky: { label:'Rocky', ground:()=>rockPattern, patch:()=>grassPattern, obstacleChance:0.6,  obstacleTint:null, moles:false },
  snow:  { label:'Snow',  ground:()=>snowPattern, patch:()=>rockPattern, obstacleChance:0.4,  obstacleTint:'rgba(205,224,238,0.55)', moles:true },
  space: { label:'Space', ground:()=>spacePattern, patch:null,           obstacleChance:0.45, obstacleTint:'rgba(140,130,120,0.45)', moles:false }
};
let rockyPatches = [];   // accent-patch centers — also where obstacle clusters anchor
let obstacles = [];
let groundPattern = grassPattern;
let patchPattern = rockPattern;
let obstacleTint = null;
let currentMap = 'grass';
let molesAllowedForMap = true;

// (Re)builds the whole terrain + obstacle layout for the chosen map. Called
// once per game start (see startGame) rather than once at page load, so
// picking a different map on the start screen actually takes effect.
//
// Obstacle circles/poly/cracks/lichen/craters are stored as offsets from
// the cluster's own (cx,cy) rather than absolute world coordinates — that's
// what lets a whole cluster translate as one rigid body each frame (used
// for asteroids drifting on the space map; static maps just never move
// cx/cy). World position of anything in a circle is always o.cx+thing.ox.
function generateWorld(mapType){
  const cfg = MAP_CONFIGS[mapType] || MAP_CONFIGS.grass;
  currentMap = mapType;
  groundPattern = cfg.ground();
  patchPattern = cfg.patch ? cfg.patch() : null;
  obstacleTint = cfg.obstacleTint;
  molesAllowedForMap = cfg.moles;
  const isSpace = mapType === 'space';

  rockyPatches = [];
  const count = Math.floor((WORLD_W*WORLD_H) / 900000) + 6;
  for(let i=0;i<count;i++){
    rockyPatches.push({ x: rand(0, WORLD_W), y: rand(0, WORLD_H), r: rand(90, 240) });
  }

  // Solid boulder (or, on the space map, asteroid) clusters anchored to
  // some of the accent patches — these can't be passed through; hitting
  // one is fatal, same as hitting a body. Each chunk gets a jagged (not
  // perfectly round) outline, all baked in once here so the texture is
  // stable rather than recomputed (and jittering) every frame.
  obstacles = [];
  for(let i=0;i<rockyPatches.length;i++){
    const patch = rockyPatches[i];
    if(Math.random() > cfg.obstacleChance) continue; // not every patch gets a cluster
    const cx = patch.x + rand(-patch.r*0.25, patch.r*0.25);
    const cy = patch.y + rand(-patch.r*0.25, patch.r*0.25);
    const n = 3 + Math.floor(Math.random()*3); // 3-5 chunks per cluster
    const circles = [];
    for(let k=0;k<n;k++){
      const ox = rand(-32,32), oy = rand(-32,32), br = rand(16,34);
      // Asteroids are more angular (fewer points, wider radius swing)
      // than the rounder rock/dirt boulders.
      const pts = isSpace ? 7+Math.floor(Math.random()*4) : 10+Math.floor(Math.random()*4);
      const swing = isSpace ? 0.55 : 0.36;
      const base = isSpace ? 0.62 : 0.76;
      const poly = [];
      let minPolyR = Infinity;
      for(let a=0;a<pts;a++){
        const ang = (a/pts)*Math.PI*2;
        const rr = br * (base + Math.random()*swing);
        minPolyR = Math.min(minPolyR, rr);
        poly.push({ ox: ox+Math.cos(ang)*rr, oy: oy+Math.sin(ang)*rr });
      }
      let cracks = [], lichen = null, craters = [];
      if(isSpace){
        // impact craters instead of cracks/lichen
        const craterCount = 2 + Math.floor(Math.random()*3);
        for(let c=0;c<craterCount;c++){
          craters.push({
            ox: ox+rand(-br*0.45,br*0.45), oy: oy+rand(-br*0.45,br*0.45),
            r: br*rand(0.14,0.3)
          });
        }
      } else {
        const crackCount = 1+Math.floor(Math.random()*2);
        for(let c=0;c<crackCount;c++){
          const a1 = rand(0,Math.PI*2);
          const len = br*rand(0.4,0.8);
          cracks.push({
            x1o: ox+Math.cos(a1)*br*0.15, y1o: oy+Math.sin(a1)*br*0.15,
            x2o: ox+Math.cos(a1)*len,     y2o: oy+Math.sin(a1)*len
          });
        }
        lichen = (mapType==='grass' && Math.random()<0.5) ? {
          ox: ox+rand(-br*0.35,br*0.35), oy: oy+rand(-br*0.35,br*0.35), r: br*rand(0.18,0.3)
        } : null;
      }
      // Collision uses the jagged outline's own tightest point (with a
      // small safety margin inward), not the base radius — otherwise the
      // invisible hitbox reaches past the visible rock at its narrow
      // points and you can "die from nothing".
      circles.push({ ox, oy, r:br, hitR: minPolyR*0.9, poly, cracks, lichen, craters });
    }
    let boundingR = 0;
    for(const c of circles) boundingR = Math.max(boundingR, Math.hypot(c.ox,c.oy)+c.r);

    let moving=false, vx=0, vy=0;
    if(isSpace){
      moving = true;
      const dir = rand(0,Math.PI*2);
      const speed = rand(90,140); // roughly a snake's own cruising speed
      vx = Math.cos(dir)*speed; vy = Math.sin(dir)*speed;
    }
    obstacles.push({ cx, cy, boundingR, circles, type: isSpace?'asteroid':'rock', moving, vx, vy });
  }
}

// Drifting obstacles (asteroids on the space map) translate as a rigid
// cluster and bounce off the world edges; everything else stays put.
function updateObstacles(dt){
  for(let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    if(!o.moving) continue;
    o.cx += o.vx*dt; o.cy += o.vy*dt;
    if(o.cx-o.boundingR<0){ o.cx=o.boundingR; o.vx=Math.abs(o.vx); }
    else if(o.cx+o.boundingR>WORLD_W){ o.cx=WORLD_W-o.boundingR; o.vx=-Math.abs(o.vx); }
    if(o.cy-o.boundingR<0){ o.cy=o.boundingR; o.vy=Math.abs(o.vy); }
    else if(o.cy+o.boundingR>WORLD_H){ o.cy=WORLD_H-o.boundingR; o.vy=-Math.abs(o.vy); }
  }
}

// Builds a dirt-pile obstacle the same way as a boulder cluster (jagged
// silhouette baked once, offsets relative to its own center) — used when
// a mole finishes digging. Dirt piles never move.
function makeDirtPileObstacle(cx, cy){
  const n = 1 + Math.floor(Math.random()*2); // 1-2 mound lumps
  const circles = [];
  for(let k=0;k<n;k++){
    const ox = rand(-14,14), oy = rand(-14,14), br = rand(26,42);
    const pts = 10 + Math.floor(Math.random()*4);
    const poly = [];
    let minPolyR = Infinity;
    for(let a=0;a<pts;a++){
      const ang = (a/pts)*Math.PI*2;
      const rr = br * (0.8 + Math.random()*0.3);
      minPolyR = Math.min(minPolyR, rr);
      poly.push({ ox: ox+Math.cos(ang)*rr, oy: oy+Math.sin(ang)*rr });
    }
    circles.push({ ox, oy, r:br, hitR: minPolyR*0.9, poly, cracks:[], lichen:null, craters:[] });
  }
  let boundingR = 0;
  for(const c of circles) boundingR = Math.max(boundingR, Math.hypot(c.ox,c.oy)+c.r);
  return { cx, cy, boundingR, circles, type: 'dirt', moving:false, vx:0, vy:0 };
}

// True if a circle at (x,y) radius r overlaps any obstacle — used both for
// collision (is this snake's head touching rock?) and for keeping food,
// boosts, and spawn points from landing inside solid rock. Uses hitR (the
// jagged outline's own tightest point, not the wider base radius) so the
// hitbox never reaches past what's actually drawn.
function hitsObstacle(x, y, r){
  for(let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    const reach = o.boundingR + r;
    if(dist2(x,y,o.cx,o.cy) > reach*reach) continue;
    for(let j=0;j<o.circles.length;j++){
      const c = o.circles[j];
      const rr = r + c.hitR;
      if(dist2(x,y,o.cx+c.ox,o.cy+c.oy) < rr*rr) return true;
    }
  }
  return false;
}

function outlinePoly(o, poly, camX, camY){
  ctx.moveTo(o.cx+poly[0].ox-camX, o.cy+poly[0].oy-camY);
  for(let k=1;k<poly.length;k++) ctx.lineTo(o.cx+poly[k].ox-camX, o.cy+poly[k].oy-camY);
  ctx.closePath();
}

function drawObstacles(camX, camY){
  for(let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    const sx = o.cx-camX, sy = o.cy-camY;
    if(sx<-o.boundingR-40-zoomMargin||sx>viewW+o.boundingR+40+zoomMargin||sy<-o.boundingR-40-zoomMargin||sy>viewH+o.boundingR+40+zoomMargin) continue;
    const pattern = o.type==='dirt' ? dirtPattern : rockPattern;
    const outlineColor = o.type==='dirt' ? 'rgba(38,28,18,0.5)' : (o.type==='asteroid' ? 'rgba(20,18,16,0.6)' : 'rgba(35,32,27,0.45)');

    for(let j=0;j<o.circles.length;j++){
      const c = o.circles[j];
      const bx = o.cx+c.ox-camX, by = o.cy+c.oy-camY;
      // Asteroids float in space — no ground shadow, unlike rocks/dirt
      // sitting on terrain.
      if(o.type!=='asteroid'){
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(bx+3, by+5, c.r*0.95, c.r*0.6, 0, 0, Math.PI*2);
        ctx.fill();
      }
    }

    for(let j=0;j<o.circles.length;j++){
      const c = o.circles[j];
      const bx = o.cx+c.ox-camX, by = o.cy+c.oy-camY;
      const wx = o.cx+c.ox, wy = o.cy+c.oy;

      // jagged silhouette, filled with the rock or dirt texture pattern
      ctx.save();
      ctx.beginPath(); outlinePoly(o, c.poly, camX, camY); ctx.clip();
      ctx.translate(-camX, -camY);
      ctx.fillStyle = pattern;
      ctx.fillRect(wx-c.r*1.4, wy-c.r*1.4, c.r*2.8, c.r*2.8);
      ctx.translate(camX, camY);
      // directional light/shadow overlay for volume
      const grad = ctx.createRadialGradient(bx-c.r*0.35, by-c.r*0.4, c.r*0.1, bx, by, c.r*1.15);
      grad.addColorStop(0, 'rgba(255,255,255,0.14)');
      grad.addColorStop(0.55, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.38)');
      ctx.fillStyle = grad;
      ctx.beginPath(); outlinePoly(o, c.poly, camX, camY); ctx.fill();

      // map-specific tint (icy blue for snow, dusty grey for space asteroids)
      if(obstacleTint && (o.type==='rock' || o.type==='asteroid')){
        ctx.fillStyle = obstacleTint;
        ctx.beginPath(); outlinePoly(o, c.poly, camX, camY); ctx.fill();
      }
      ctx.restore();

      ctx.strokeStyle = outlineColor;
      ctx.lineWidth = 1.6;
      ctx.beginPath(); outlinePoly(o, c.poly, camX, camY); ctx.stroke();

      ctx.strokeStyle = 'rgba(30,27,22,0.5)';
      ctx.lineWidth = 1.3;
      for(const cr of c.cracks){
        ctx.beginPath();
        ctx.moveTo(o.cx+cr.x1o-camX, o.cy+cr.y1o-camY);
        ctx.lineTo(o.cx+cr.x2o-camX, o.cy+cr.y2o-camY);
        ctx.stroke();
      }
      if(c.lichen){
        ctx.fillStyle = 'rgba(140,168,92,0.42)';
        ctx.beginPath();
        ctx.arc(o.cx+c.lichen.ox-camX, o.cy+c.lichen.oy-camY, c.lichen.r, 0, Math.PI*2);
        ctx.fill();
      }
      // impact craters — darker recessed circles with a thin rim highlight
      for(const cr of c.craters){
        const crx = o.cx+cr.ox-camX, cry = o.cy+cr.oy-camY;
        ctx.fillStyle = 'rgba(15,13,12,0.45)';
        ctx.beginPath(); ctx.arc(crx,cry,cr.r,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(crx,cry,cr.r,0,Math.PI*1.3); ctx.stroke();
      }
    }
  }
}

function drawTerrain(camX, camY){
  // Continuous ground texture for whichever map is active, anchored to
  // world space (not screen space) so it scrolls correctly with the
  // camera instead of swimming in place. Expanded by zoomMargin so
  // zooming out never reveals unfilled edges.
  ctx.save();
  ctx.translate(-camX, -camY);
  ctx.fillStyle = groundPattern;
  ctx.fillRect(camX-zoomMargin, camY-zoomMargin, viewW+zoomMargin*2, viewH+zoomMargin*2);

  // Accent patches blended in with soft, feathered edges — layered
  // concentric circles from a wide faint one down to a small opaque one
  // fake a soft falloff cheaply, so the patch fades into the base ground
  // instead of cutting off at a hard tile boundary. Space has no patch
  // texture (a starfield doesn't need islands of something else), so this
  // is skipped there — the accent centers still exist for obstacle
  // placement, just aren't drawn into the ground.
  if(patchPattern){
    for(let i=0;i<rockyPatches.length;i++){
      const p = rockyPatches[i];
      if(p.x+p.r < camX-50-zoomMargin || p.x-p.r > camX+viewW+50+zoomMargin || p.y+p.r < camY-50-zoomMargin || p.y-p.r > camY+viewH+50+zoomMargin) continue;
      const rings = 5;
      for(let ring=0; ring<rings; ring++){
        const t = ring/(rings-1);
        const rr = p.r * (1 - t*0.35);
        ctx.globalAlpha = 0.22 + t*0.78;
        ctx.save();
        ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, Math.PI*2); ctx.clip();
        ctx.fillStyle = patchPattern;
        ctx.fillRect(p.x-p.r, p.y-p.r, p.r*2, p.r*2);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

/* ============================== FOOD ============================== */
const MAX_FOOD = 20;
const food = []; // {x,y,r,value,color,bob}
const FOOD_COLORS = ['#f2b84b','#e2574c','#9fd356','#f2e394','#e88a5a'];

function spawnFoodAt(x,y,value){
  value = value || 1;
  food.push({
    x: clamp(x,20,WORLD_W-20), y: clamp(y,20,WORLD_H-20),
    r: (4 + value*1.4) * 2,
    value: value,
    color: pick(FOOD_COLORS),
    bob: Math.random()*Math.PI*2
  });
}
function spawnRandomFood(){
  if(food.length >= MAX_FOOD) return;
  let x, y, tries = 0;
  do {
    x = rand(40,WORLD_W-40); y = rand(40,WORLD_H-40);
    tries++;
  } while(hitsObstacle(x,y,10) && tries<8);
  spawnFoodAt(x, y, pick([1,1,1,2,2,3]));
}
for(let i=0;i<MAX_FOOD;i++) spawnRandomFood();

/* ============================== BOOST POWER-UP ============================== */
const BOOST_SPAWN_INTERVAL = 20; // seconds
const BOOST_DURATION = 6;        // seconds of effect once grabbed
const BOOST_SPEED_MULT = 3;      // speed becomes 300% of normal while active
const BOOST_COLOR = '#00e5ff';   // electric blue
let boostPickup = null;          // {x,y,r} — only one on the map at a time
let boostSpawnTimer = BOOST_SPAWN_INTERVAL;

function spawnBoostPickup(){
  let x, y, tries = 0;
  do {
    x = rand(60, WORLD_W-60); y = rand(60, WORLD_H-60);
    tries++;
  } while(hitsObstacle(x,y,15) && tries<8);
  boostPickup = { x, y, r: 15 };
}
function updateBoostSpawn(dt){
  boostSpawnTimer -= dt;
  if(boostSpawnTimer <= 0){
    boostSpawnTimer = BOOST_SPAWN_INTERVAL;
    if(!boostPickup) spawnBoostPickup();
  }
}
function activateBoost(s){
  s.boosted = true;
  s.boostTimer = BOOST_DURATION;
  s.speed = s.baseSpeed * BOOST_SPEED_MULT;
  s.color = BOOST_COLOR;
  s.invuln = Math.max(s.invuln, BOOST_DURATION); // immortal for the boost's duration
  world.toast(`${s===me?'You':s.name} hit the surge — electric & unstoppable!`);
  if(s===me) sfx.boost();
}
function checkBoostPickup(){
  if(!boostPickup) return;
  for(let i=0;i<players.length;i++){
    const s = players[i];
    if(!s.alive) continue;
    const rr = s.headR + boostPickup.r;
    if(dist2(s.head.x, s.head.y, boostPickup.x, boostPickup.y) < rr*rr){
      activateBoost(s);
      boostPickup = null;
      break;
    }
  }
}
function drawBoostPickup(){
  if(!boostPickup) return;
  const sx = boostPickup.x - camX, sy = boostPickup.y - camY;
  if(sx < -30-zoomMargin || sx > viewW+30+zoomMargin || sy < -30-zoomMargin || sy > viewH+30+zoomMargin) return;
  const pulse = 1 + Math.sin(world.time*6) * 0.15;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(pulse, pulse);
  ctx.shadowColor = BOOST_COLOR;
  ctx.shadowBlur = 22;
  ctx.fillStyle = BOOST_COLOR;
  ctx.beginPath();
  ctx.moveTo(-4,-15); ctx.lineTo(5,-2); ctx.lineTo(-1,-2);
  ctx.lineTo(6,15); ctx.lineTo(-5,1); ctx.lineTo(1,1);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.shadowBlur = 0;
}

/* ============================== INVISIBILITY POWER-UP ============================== */
const INVIS_SPAWN_INTERVAL = 25; // seconds
const INVIS_DURATION = 5;        // seconds of effect once grabbed
const INVIS_SPEED_MULT = 1.5;    // speed becomes 150% of normal while active
const INVIS_COLOR = '#c4b5fd';   // pale smoky violet
let invisPickup = null;          // {x,y,r} — only one on the map at a time
let invisSpawnTimer = INVIS_SPAWN_INTERVAL * 0.5; // offset from the boost timer so they don't sync up

function spawnInvisPickup(){
  let x, y, tries = 0;
  do {
    x = rand(60, WORLD_W-60); y = rand(60, WORLD_H-60);
    tries++;
  } while(hitsObstacle(x,y,15) && tries<8);
  invisPickup = { x, y, r: 15 };
}
function updateInvisSpawn(dt){
  invisSpawnTimer -= dt;
  if(invisSpawnTimer <= 0){
    invisSpawnTimer = INVIS_SPAWN_INTERVAL;
    if(!invisPickup) spawnInvisPickup();
  }
}
function activateInvis(s){
  s.invisible = true;
  s.invisTimer = INVIS_DURATION;
  s.speed = s.baseSpeed * INVIS_SPEED_MULT;
  world.toast(`${s===me?'You':s.name} faded from sight — quick & unseen!`);
  if(s===me) sfx.invis();
}
function checkInvisPickup(){
  if(!invisPickup) return;
  for(let i=0;i<players.length;i++){
    const s = players[i];
    if(!s.alive) continue;
    const rr = s.headR + invisPickup.r;
    if(dist2(s.head.x, s.head.y, invisPickup.x, invisPickup.y) < rr*rr){
      activateInvis(s);
      invisPickup = null;
      break;
    }
  }
}
function drawInvisPickup(){
  if(!invisPickup) return;
  const sx = invisPickup.x - camX, sy = invisPickup.y - camY;
  if(sx < -30-zoomMargin || sx > viewW+30+zoomMargin || sy < -30-zoomMargin || sy > viewH+30+zoomMargin) return;
  const pulse = 1 + Math.sin(world.time*5) * 0.12;
  const wispAlpha = 0.55 + Math.sin(world.time*3)*0.2;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(pulse, pulse);
  ctx.shadowColor = INVIS_COLOR;
  ctx.shadowBlur = 18;
  ctx.globalAlpha = wispAlpha;
  ctx.fillStyle = INVIS_COLOR;
  ctx.beginPath();
  ctx.ellipse(0, 0, 10, 13, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = wispAlpha*0.6;
  ctx.beginPath();
  ctx.ellipse(-4,-3, 4, 5, 0.4, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

/* ============================== MOLES ============================== */
// Every MOLE_INTERVAL seconds a mole pops up out of the ground somewhere
// random, digs for a bit, then dives back down — leaving a permanent pile
// of dirt behind that becomes a new (solid, deadly) obstacle. The pop-up
// itself is a 16-frame hand-drawn sprite sequence (ground -> mole emerges
// -> looks around -> digs back down -> settles into a dirt pile).
const MOLE_INTERVAL = 15;   // seconds between mole events
const MOLE_DURATION = 2.4;  // seconds the 16-frame pop-up animation takes

const MOLE_FRAMES = [{"sx": 0, "sy": 0, "sw": 97, "sh": 32}, {"sx": 97, "sy": 0, "sw": 97, "sh": 59}, {"sx": 194, "sy": 0, "sw": 96, "sh": 54}, {"sx": 290, "sy": 0, "sw": 97, "sh": 74}, {"sx": 387, "sy": 0, "sw": 98, "sh": 83}, {"sx": 485, "sy": 0, "sw": 100, "sh": 92}, {"sx": 585, "sy": 0, "sw": 100, "sh": 87}, {"sx": 685, "sy": 0, "sw": 100, "sh": 99}, {"sx": 785, "sy": 0, "sw": 100, "sh": 85}, {"sx": 885, "sy": 0, "sw": 100, "sh": 86}, {"sx": 985, "sy": 0, "sw": 99, "sh": 78}, {"sx": 1085, "sy": 0, "sw": 99, "sh": 63}, {"sx": 1184, "sy": 0, "sw": 99, "sh": 54}, {"sx": 1283, "sy": 0, "sw": 100, "sh": 60}, {"sx": 1383, "sy": 0, "sw": 100, "sh": 61}, {"sx": 1483, "sy": 0, "sw": 100, "sh": 53}];

function nearAnySnakeHead(x, y, minDist){
  for(let i=0;i<players.length;i++){
    const p = players[i];
    if(!p.alive) continue;
    if(dist2(x,y,p.head.x,p.head.y) < minDist*minDist) return true;
  }
  return false;
}
function spawnMole(){
  let x, y, tries = 0;
  do {
    x = rand(60, WORLD_W-60); y = rand(60, WORLD_H-60);
    tries++;
  } while((hitsObstacle(x,y,45) || nearAnySnakeHead(x,y,170)) && tries<12);
  moles.push({ x, y, spawnedAt: world.time, duration: MOLE_DURATION, seed: rand(0,10) });
  sfx.mole();
}
function updateMoles(dt){
  moleSpawnTimer -= dt;
  if(moleSpawnTimer <= 0){
    moleSpawnTimer = MOLE_INTERVAL;
    if(molesAllowedForMap) spawnMole();
  }
  for(let i=moles.length-1;i>=0;i--){
    const m = moles[i];
    if(world.time - m.spawnedAt >= m.duration){
      obstacles.push(makeDirtPileObstacle(m.x, m.y));
      moles.splice(i,1);
    }
  }
}
function drawMoles(camX, camY){
  if(!moleSpriteImg.complete || !moleSpriteImg.naturalWidth) return;
  for(let i=0;i<moles.length;i++){
    const m = moles[i];
    const t = clamp((world.time - m.spawnedAt) / m.duration, 0, 0.999);
    const sx = m.x-camX, sy = m.y-camY;
    if(sx<-70-zoomMargin||sx>viewW+70+zoomMargin||sy<-70-zoomMargin||sy>viewH+70+zoomMargin) continue;

    const frameIdx = Math.min(MOLE_FRAMES.length-1, Math.floor(t*MOLE_FRAMES.length));
    const f = MOLE_FRAMES[frameIdx];
    // anchor each frame at ground level (its own bottom-center) so the
    // sequence reads as one creature rising from / sinking into one spot
    const dx = sx - f.sw/2, dy = sy - f.sh + 6;
    ctx.drawImage(moleSpriteImg, f.sx, f.sy, f.sw, f.sh, dx, dy, f.sw, f.sh);
  }
}

// Resolve ANY CSS color string (hex, hsl(...), named color) to r,g,b by
// letting the canvas itself parse it — works for both the swatch hexes and
// the hsl(...) strings generated for bots.
const _colorProbe = document.createElement('canvas');
_colorProbe.width = 1; _colorProbe.height = 1;
const _colorProbeCtx = _colorProbe.getContext('2d');
function colorStringToRGB(colorStr){
  _colorProbeCtx.clearRect(0,0,1,1);
  _colorProbeCtx.fillStyle = colorStr;
  _colorProbeCtx.fillRect(0,0,1,1);
  const d = _colorProbeCtx.getImageData(0,0,1,1).data;
  return [d[0], d[1], d[2]];
}
function rgbToHsl(r,g,b){

  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0, s=0; const l=(max+min)/2;
  const d = max-min;
  if(d>0){
    s = d / (1 - Math.abs(2*l-1));

  const [th,,ts] = rgbToHsl(tr,tg,tb);
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const cctx = c.getContext('2d');
  cctx.drawImage(img,0,0);
  const id = cctx.getImageData(0,0,c.width,c.height);
  const d = id.data;
  for(let i=0;i<d.length;i+=4){
    const a = d[i+3];
    if(a < 10) continue;
    const [h,s,l] = rgbToHsl(d[i], d[i+1], d[i+2]);
    const isDark = l < 0.16;
    const isLight = (l > 0.92 && s < 0.25);
    const isRedBrown = (h < 0.12 || h > 0.95);
    if(isDark || isLight || isRedBrown) continue;
    const [nr,ng,nb] = hslToRgb(th, ts, l);
    d[i]=nr; d[i+1]=ng; d[i+2]=nb;
  }
  cctx.putImageData(id,0,0);
  return c;
}
// One shared recolor per exact color string (a handful of swatches + one
// boost color + up to a few dozen bot hues) rather than per-frame work.
const _spriteSetCache = new Map();
function getSpriteSet(colorStr){
  if(!spriteImagesReady()) return null;
  let set = _spriteSetCache.get(colorStr);
  if(!set){
    set = {
      head: recolorSprite(snakeHeadImg, colorStr),
      tail: recolorSprite(snakeTailImg, colorStr),
      body: recolorSprite(snakeBodyImg, colorStr)
    };
    _spriteSetCache.set(colorStr, set);
  }
  return set;
}

/* ============================== SNAKES ============================== */

const SPACING = 7;          // distance between stored path points
const BASE_LEN = 9;         // starting segment count
const SEG_PER_VALUE = 3;    // growth per food value point
const WIN_SCORE = 100;

// Radius of the body at segment index `idx` of `total` — mirrors the
// tapering used when the body is actually drawn, so hitboxes match what
// you see (the "whole snake", not just its head-center point).
function segmentRadius(headR, idx, total){
  const t = 1 - idx/total;
  return headR*0.82*(0.55+0.45*t);
}

const SWATCH_COLORS = ['#2dd4bf','#ff6b6b','#a78bfa','#fbbf24','#9fd356','#f472b6','#38bdf8','#fb923c','#ef4444','#e5e7eb'];
const BOT_NAME_POOL = ['Rusty','Iris','Goldie','Fang','Viper','Coral','Jade','Ash','Sable','Cinder',
  'Moss','Ember','Briar','Slate','Willow','Thorn','Copper','Hazel','Onyx','Clover',
  'Rowan','Flint','Basil','Amber','Dusk','Reed','Bramble','Pepper','Sage','Marsh'];
function botName(i){ return BOT_NAME_POOL[i % BOT_NAME_POOL.length] + (i>=BOT_NAME_POOL.length ? ' '+(Math.floor(i/BOT_NAME_POOL.length)+1) : ''); }
function botColor(i, total){
  const hue = (i / Math.max(total,1)) * 360;
  return `hsl(${hue.toFixed(0)}, 68%, 58%)`;
}
const HEAD_STYLES = ['classic','viper','cobra','horned'];

// The tightest a snake can turn without its own thickening body clipping
// its tail — turn radius is speed/turnRate, so this caps turnRate so that
// radius never drops below the body's own width. Without this, a fixed
// turn rate on a snake that keeps getting thicker as it grows would
// eventually make perfectly ordinary turns clip its own tail — the
// "died with no collision" bug (it WAS colliding, just at a turn radius
// tighter than its own body could safely make).
function maxSafeTurnRate(snake){
  return snake.speed / (snake.headR * 2.1);
}

class Snake{
  constructor(id, color, name, isAI, headStyle, headPhotoURL){
    this.id = id;
    this.baseColor = color;
    this.color = color;
    this.name = name;
    this.isAI = isAI;
    this.headStyle = headStyle || 'classic';
    this.headImage = null;
    if(headPhotoURL){
      this.headStyle = 'photo';
      this.headImage = new Image();
      this.headImage.src = headPhotoURL;
    }
    this.score = 0;
    this.reset();
  }
  reset(){
    let x, y, tries = 0;
    do {
      x = rand(WORLD_W*0.2, WORLD_W*0.8);
      y = rand(WORLD_H*0.2, WORLD_H*0.8);
      tries++;
    } while(hitsObstacle(x,y,40) && tries<10);
    this.angle = rand(0,Math.PI*2);
    this.targetAngle = this.angle;
    this.baseSpeed = 118; // px/sec
    this.speed = this.baseSpeed;
    this.segLen = BASE_LEN;
    this.headR = 18;
    this.turnRateBase = this.isAI ? 2.6 : 3.4;
    this.turnRate = this.turnRateBase;
    this.boosted = false;
    this.boostTimer = 0;
    this.invisible = false;
    this.invisTimer = 0;
    this.color = this.baseColor;
    this.alive = true;
    this.respawnAt = 0;
    this.path = [{x,y}];
    this.dist = 0;
    this.wanderT = rand(0,10);
    this.deathFlash = 0;
    this.invuln = 1.1; // brief grace period after spawn
    if(this.tongueSeed===undefined) this.tongueSeed = rand(0,10);
    if(this.patternSeed===undefined) this.patternSeed = rand(0,1000);
  }
  get head(){ return this.path[0]; }

  segments(){
    // sample points along path at SPACING intervals, count = segLen
    const pts = [];
    const p = this.path;
    let need = this.segLen;
    let acc = 0;
    let prev = p[0];
    pts.push(prev);
    for(let i=1;i<p.length && pts.length<need;i++){
      const cur = p[i];
      const segDist = Math.hypot(cur.x-prev.x, cur.y-prev.y);
      let travelled = 0;
      while(travelled < segDist && pts.length<need){
        // step by remaining spacing budget from acc
        const remain = SPACING - acc;
        if(travelled + remain <= segDist){
          travelled += remain;
          const t = travelled/segDist;
          pts.push({x: prev.x+(cur.x-prev.x)*t, y: prev.y+(cur.y-prev.y)*t});
          acc = 0;
        } else {
          acc += (segDist - travelled);
          travelled = segDist;
        }
      }
      prev = cur;
    }
    // No padding: if there isn't yet enough recorded path history to reach
    // `need` (e.g. right after eating several food pieces in quick
    // succession), just return what's real. Padding used to duplicate the
    // oldest known point for every missing segment — all stacked at one
    // spot — which could sit within self-collision range of the head with
    // nothing actually visible there. The real body catches up within a
    // frame or two as more path is recorded, so this is never visible.
    return pts;
  }

  update(dt, world){
    if(!this.alive){
      return;
    }
    if(this.invuln>0) this.invuln -= dt;

    if(this.boosted){
      this.boostTimer -= dt;
      if(this.boostTimer <= 0){
        this.boosted = false;
        if(!this.invisible) this.speed = this.baseSpeed;
        this.color = this.baseColor;
      }
    }

    if(this.invisible){
      this.invisTimer -= dt;
      if(this.invisTimer <= 0){
        this.invisible = false;
        if(!this.boosted) this.speed = this.baseSpeed;
      }
    }

    // steer toward targetAngle with limited turn rate (capped so it can
    // never physically out-turn its own body width)
    const d = angDiff(this.angle, this.targetAngle);
    const effTurnRate = Math.min(this.turnRate, maxSafeTurnRate(this));
    const maxStep = effTurnRate * dt;
    this.angle += clamp(d, -maxStep, maxStep);

    const speed = this.speed;
    let nx = this.head.x + Math.cos(this.angle)*speed*dt;
    let ny = this.head.y + Math.sin(this.angle)*speed*dt;

    // soft wall bounce (keep inside world)
    const margin = 12;
    if(nx < margin){ nx = margin; this.targetAngle = 0; }
    if(nx > WORLD_W-margin){ nx = WORLD_W-margin; this.targetAngle = Math.PI; }
    if(ny < margin){ ny = margin; this.targetAngle = Math.PI/2; }
    if(ny > WORLD_H-margin){ ny = WORLD_H-margin; this.targetAngle = -Math.PI/2; }

    this.path.unshift({x:nx, y:ny});
    const maxPts = this.segLen*3 + 20;
    if(this.path.length > maxPts) this.path.length = maxPts;

    // gentle size growth cap for visuals (2x base scale)
    this.headR = (8 + Math.min(10, this.segLen/22)) * 2;

    if(this.deathFlash>0) this.deathFlash -= dt;
  }

  grow(value){
    this.segLen += value*SEG_PER_VALUE;
    this.score += value;
  }

  die(world, killer, cause){
    if(!this.alive) return;
    this.alive = false;
    this.deathFlash = 1;
    this.score = 0; // dissolving wipes the score, not just the body
    const segs = this.segments();
    // Dissolve the whole body into food, right where it was lying.
    // This always happens (it's not capped by MAX_FOOD) so the corpse
    // is fully represented; random ambient spawns stay capped separately.
    const step = 3;
    let dropped = 0;
    for(let i=0; i<segs.length; i+=step){
      const s = segs[i];
      const jitter = 4;
      spawnFoodAt(s.x+rand(-jitter,jitter), s.y+rand(-jitter,jitter), 1);
      dropped++;
    }
    this.respawnAt = world.time + 1.4;
    let msg;
    if(cause==='obstacle') msg = `${this.name} slammed into an obstacle — dissolving into the patch`;
    else msg = `${this.name} was ${killer?('bitten by '+killer.name):'lost'} — dissolving into the patch`;
    world.toast(msg);
    if(this===me) sfx.death();
  }
}

/* Players are built once the user confirms their picks on the start screen */
let players = [];
let me = null;
function buildPlayers(enemyCount, playerColor, playerHeadStyle, playerHeadPhoto){
  players = [];
  const you = new Snake('you', playerColor, 'You', false, playerHeadStyle, playerHeadPhoto);
  players.push(you);
  for(let i=0;i<enemyCount;i++){
    const style = HEAD_STYLES[(i+1) % HEAD_STYLES.length];
    players.push(new Snake('bot'+i, botColor(i, enemyCount), botName(i), true, style));
  }
  me = you;
}

/* ============================== AI BEHAVIOR ============================== */
// Looks ahead along a candidate direction and reports whether it would
// run into the snake's OWN body (skipping the same near-head margin used
// by real collision). This is what real "don't bite yourself" judgment
// requires — without it, an AI can only react to threats and food, and
// will happily curl back through its own tail as it grows. Checks both a
// near and a far point along the candidate path — a single far-out check
// can miss a tight squeeze that's unsafe close-in but clears again further
// out — and uses a hitbox with real early-warning room (bigger than the
// actual collision radius) so it reacts before getting genuinely close.
function isSelfDirectionSafe(snake, angle, lookAheadDist){
  const segs = snake.cachedSegs || snake.segments();
  const n = segs.length;
  const selfSkip = Math.max(20, Math.ceil((snake.headR*2.6)/SPACING));
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const checkAt = (dist)=>{
    const px = snake.head.x + cosA*dist, py = snake.head.y + sinA*dist;
    for(let j=selfSkip;j<n;j+=2){
      const segR = segmentRadius(snake.headR, j, n);
      const rr = (snake.headR*0.5 + segR*0.8) * 1.4; // 1.4x = early-warning buffer
      if(dist2(px,py,segs[j].x,segs[j].y) < rr*rr) return false;
    }
    return true;
  };
  return checkAt(lookAheadDist*0.45) && checkAt(lookAheadDist);
}
// Tries the desired direction first, then fans outward (alternating left
// and right) until it finds one that doesn't lead into its own body.
const AI_STEER_OFFSETS = [0, 0.4,-0.4, 0.8,-0.8, 1.2,-1.2, 1.7,-1.7, 2.3,-2.3, Math.PI];
function pickSafeDirection(snake, desired){
  const lookAhead = Math.max(110, snake.speed*0.9);
  for(let i=0;i<AI_STEER_OFFSETS.length;i++){
    const a = desired + AI_STEER_OFFSETS[i];
    if(isSelfDirectionSafe(snake, a, lookAhead)) return a;
  }
  return desired; // nothing came up clean (rare) — better to try than freeze
}

function updateAI(snake, dt, world){
  snake.wanderT -= dt;

  // Food: prefer a mix of "close" and "worth more" rather than pure
  // nearest, so a bigger pellet a bit further away can win out.
  let best=null, bestScore=-Infinity, bestD=Infinity;
  for(let i=0;i<food.length;i++){
    const f = food[i];
    const d2 = dist2(snake.head.x, snake.head.y, f.x, f.y);
    const score = f.value*140 - Math.sqrt(d2);
    if(score > bestScore){ bestScore=score; best=f; bestD=d2; }
  }

  // Power-ups are worth detouring for — a real "plan to win" AI uses them
  // instead of only reacting to food right under its nose.
  let pick=null, pickD=Infinity;
  if(boostPickup){
    const d2 = dist2(snake.head.x, snake.head.y, boostPickup.x, boostPickup.y);
    if(d2 < 700*700){ pick=boostPickup; pickD=d2; }
  }
  if(invisPickup){
    const d2 = dist2(snake.head.x, snake.head.y, invisPickup.x, invisPickup.y);
    if(d2 < 700*700 && d2 < pickD){ pick=invisPickup; pickD=d2; }
  }

  // avoid bigger snakes' heads if close (invisible snakes go unnoticed)
  let threat=null, threatD=Infinity;
  for(let i=0;i<players.length;i++){
    const o = players[i];
    if(o===snake || !o.alive || o.invisible) continue;
    const d = dist2(snake.head.x, snake.head.y, o.head.x, o.head.y);
    if(o.segLen > snake.segLen*1.15 && d < 170*170 && d<threatD){ threatD=d; threat=o; }
  }
  // avoid solid rock obstacles — checked first, it's an instant kill
  let rock=null, rockD=Infinity;
  for(let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    const lookAhead = 200;
    const reach = o.boundingR + lookAhead;
    const d = dist2(snake.head.x, snake.head.y, o.cx, o.cy);
    if(d < reach*reach && d<rockD){ rockD=d; rock=o; }
  }

  // Reset to base turn rate each frame; only close-in pursuit tightens it.
  snake.turnRate = snake.turnRateBase;
  let desired = snake.targetAngle; // default: keep current heading

  if(rock){
    desired = Math.atan2(snake.head.y-rock.cy, snake.head.x-rock.cx);
    snake.turnRate = snake.turnRateBase * 1.7;
  } else if(threat){
    desired = Math.atan2(snake.head.y-threat.head.y, snake.head.x-threat.head.x);
    snake.turnRate = snake.turnRateBase * 1.4;
  } else if(pick && pickD < bestD*1.3){
    desired = Math.atan2(pick.y-snake.head.y, pick.x-snake.head.x);
    const d = Math.sqrt(pickD);
    const proximity = clamp(1 - d/220, 0, 1);
    snake.turnRate = snake.turnRateBase * (1 + proximity*proximity*3.5);
  } else if(best && bestD < 900*900){
    desired = Math.atan2(best.y-snake.head.y, best.x-snake.head.x);
    // A fixed turn rate gives every snake a minimum turning radius
    // (speed / turnRate). If food lands inside that radius, the old
    // code kept re-aiming dead-on and the snake would circle it
    // forever instead of closing the gap. Sharpen the turn the
    // closer the target gets so it can always tighten in and eat it.
    const d = Math.sqrt(bestD);
    const proximity = clamp(1 - d/220, 0, 1);
    snake.turnRate = snake.turnRateBase * (1 + proximity*proximity*3.5);
  } else if(snake.wanderT<=0){
    desired = snake.angle + rand(-0.5,0.5);
    snake.wanderT = rand(1.4,2.6);
  }

  // steer away from world edges preemptively — hard safety override
  const edge=140;
  if(snake.head.x<edge) desired = 0;
  else if(snake.head.x>WORLD_W-edge) desired = Math.PI;
  if(snake.head.y<edge) desired = Math.PI/2;
  else if(snake.head.y>WORLD_H-edge) desired = -Math.PI/2;

  // Final check: whatever it decided, never knowingly curl into its own
  // body — deflect to the nearest clean direction instead.
  snake.targetAngle = pickSafeDirection(snake, desired);
}

/* ============================== INPUT (touch / mouse steer) ============================== */
// Press and drag ANYWHERE on screen: steering direction is relative to
// wherever you first touched down, not a fixed on-screen widget — like a
// joystick that appears under your finger instead of living in a corner.
// A light ring + dot (drawn on the game canvas, see drawTouchIndicator)
// gives feedback without needing a permanent UI element.
let touchAnchor = null;   // {x,y} where the active press started
let touchCurrent = null;  // {x,y} current finger/mouse position
let primaryTouchId = null;

function steerFrom(anchor, current){
  if(!running || !me) return;
  const dx = current.x-anchor.x, dy = current.y-anchor.y;
  if(Math.hypot(dx,dy) > 10) me.targetAngle = Math.atan2(dy,dx);
}

document.addEventListener('touchstart', function(e){
  if(primaryTouchId !== null) return; // only the first finger steers
  const t = e.changedTouches[0];
  primaryTouchId = t.identifier;
  touchAnchor = {x:t.clientX, y:t.clientY};
  touchCurrent = {x:t.clientX, y:t.clientY};
}, {passive:true});
document.addEventListener('touchmove', function(e){
  for(const t of e.changedTouches){
    if(t.identifier === primaryTouchId){
      touchCurrent = {x:t.clientX, y:t.clientY};
      steerFrom(touchAnchor, touchCurrent);
    }
  }
}, {passive:true});
function releaseTouch(e){
  for(const t of e.changedTouches){
    if(t.identifier === primaryTouchId){
      primaryTouchId = null; touchAnchor = null; touchCurrent = null;
    }
  }
}
document.addEventListener('touchend', releaseTouch, {passive:true});
document.addEventListener('touchcancel', releaseTouch, {passive:true});

// Mouse equivalent (desktop): press and drag the same way.
let mouseDown = false;
document.addEventListener('mousedown', function(e){
  mouseDown = true;
  touchAnchor = {x:e.clientX, y:e.clientY};
  touchCurrent = {x:e.clientX, y:e.clientY};
});
window.addEventListener('mousemove', function(e){
  if(!mouseDown) return;
  touchCurrent = {x:e.clientX, y:e.clientY};
  steerFrom(touchAnchor, touchCurrent);
});
window.addEventListener('mouseup', function(){
  mouseDown = false; touchAnchor = null; touchCurrent = null;
});

function drawTouchIndicator(){
  if(!touchAnchor || !touchCurrent || !running) return;
  const dx = touchCurrent.x-touchAnchor.x, dy = touchCurrent.y-touchAnchor.y;
  const len = Math.hypot(dx,dy);
  ctx.save();
  ctx.strokeStyle = 'rgba(159,211,86,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(touchAnchor.x, touchAnchor.y, 34, 0, Math.PI*2); ctx.stroke();
  if(len > 4){
    ctx.strokeStyle = 'rgba(159,211,86,0.22)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(touchAnchor.x, touchAnchor.y);
    ctx.lineTo(touchCurrent.x, touchCurrent.y);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(223,245,230,0.92)';
  ctx.beginPath(); ctx.arc(touchCurrent.x, touchCurrent.y, 9, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(touchCurrent.x, touchCurrent.y, 9, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

/* ---------- Keyboard for PC: Left/Right arrows only, like a steering wheel.
   Turns the angle directly while held (proportional to how long you hold
   it, so short taps give slight nudges) and stops the instant you let go
   instead of coasting on to a leftover target angle. */
const keyState = {ArrowLeft:false, ArrowRight:false};
const KEY_TURN_RATE = 3.0; // rad/sec while a key is held
let keyWasActive = false;
window.addEventListener('keydown', function(e){
  if(e.code === 'ArrowLeft' || e.code === 'ArrowRight'){
    keyState[e.code] = true;
    e.preventDefault();
  }
});
window.addEventListener('keyup', function(e){
  if(e.code === 'ArrowLeft' || e.code === 'ArrowRight'){
    keyState[e.code] = false;
    e.preventDefault();
  }
});

/* ============================== CAMERA & WORLD ============================== */
const world = {
  time: 0,
  toastTimer: 0,
  toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    this.toastTimer = 2.0;
  }
};
let camX=0, camY=0;
let camZoom = 1;      // 1 = normal; smaller = zoomed out
let zoomMargin = 0;   // extra world-space margin now visible due to zoom-out; widen culling checks by this
let running = false;
let gameOver = false;

function updateCamera(dt){
  camX = clamp(me.head.x - viewW/2, 0, Math.max(0,WORLD_W-viewW));
  camY = clamp(me.head.y - viewH/2, 0, Math.max(0,WORLD_H-viewH));

  // Zoom out gradually as the snake grows, so a long body doesn't feel
  // cramped in the viewport. Eased toward the target rather than snapping,
  // so growth spurts don't cause a jarring camera jump.
  const targetZoom = clamp(1 / (1 + (me.segLen-BASE_LEN)/220), 0.6, 1);
  camZoom += (targetZoom-camZoom) * Math.min(1, dt*2);
  zoomMargin = Math.max(viewW,viewH) * (1/camZoom - 1);
}

/* ============================== COLLISIONS ============================== */
function checkCollisions(){
  for(let i=0;i<players.length;i++){
    const s = players[i];
    if(!s.alive || s.invuln>0) continue;
    const hx=s.head.x, hy=s.head.y;

    // Rocks are solid — hitting one is fatal, same as hitting a body.
    if(hitsObstacle(hx, hy, s.headR*0.85)){
      s.die(world, null, 'obstacle');
      continue;
    }

    // Self collision — now applies to everyone, AI included. The hitbox
    // follows the actual (tapered) body width at each point rather than
    // a flat number, so it matches what's drawn and doesn't falsely
    // trigger on normal turns, while still catching a real loop back
    // over its own path (which is what let AI get stuck endlessly
    // retracing/overlapping its own trail before). Extra-forgiving on
    // purpose: it's far better to occasionally miss a genuine self-bite
    // than to kill the player for a turn that only looked close.
    const selfSegs = s.cachedSegs || s.segments();
    const selfSkip = Math.max(20, Math.ceil((s.headR*2.6)/SPACING));
    for(let j=selfSkip; j<selfSegs.length; j++){
      const seg = selfSegs[j];
      const segR = segmentRadius(s.headR, j, selfSegs.length);
      const rr = (s.headR*0.4 + segR*0.65);
      if(dist2(hx,hy,seg.x,seg.y) < rr*rr){
        s.die(world, null);
        break;
      }
    }
    if(!s.alive) continue;

    // vs other snakes — same whole-body tapered hitbox
    for(let k=0;k<players.length;k++){
      const o = players[k];
      if(o===s || !o.alive) continue;
      const oSegs = o.cachedSegs || o.segments();
      for(let j=0;j<oSegs.length;j++){
        const seg = oSegs[j];
        const segR = segmentRadius(o.headR, j, oSegs.length);
        const rr = (s.headR*0.55 + segR*0.85);
        if(dist2(hx,hy,seg.x,seg.y) < rr*rr){
          s.die(world, o);
          break;
        }
      }
      if(!s.alive) break;
    }
  }
}

function checkFood(){
  for(let i=0;i<players.length;i++){
    const s = players[i];
    if(!s.alive) continue;
    for(let j=food.length-1;j>=0;j--){
      const f = food[j];
      const rr = s.headR + f.r;
      if(dist2(s.head.x,s.head.y,f.x,f.y) < rr*rr){
        s.grow(f.value);
        food.splice(j,1);
        if(s===me){
          sfx.eat();
        }
        if(s.score >= WIN_SCORE && !gameOver){
          endGame(s);
        }
      }
    }
  }
  while(food.length < MAX_FOOD) spawnRandomFood();
}

/* ============================== RENDER ============================== */
function drawSnake(s){
  if(!s.alive) return;
  const segs = s.cachedSegs || s.segments();
  const n = segs.length;
  if(n < 2) return;

  // Cheap offscreen skip before doing any of the ribbon math below —
  // matters once there can be up to 50 snakes on the map.
  const hx0=segs[0].x-camX, hy0=segs[0].y-camY;
  const tx0=segs[n-1].x-camX, ty0=segs[n-1].y-camY;
  const margin = 100 + zoomMargin;
  if((hx0<-margin && tx0<-margin) || (hx0>viewW+margin && tx0>viewW+margin) ||
     (hy0<-margin && ty0<-margin) || (hy0>viewH+margin && ty0>viewH+margin)) return;

  ctx.save();
  const baseAlpha = s.invisible ? 0.32 : 1;
  ctx.globalAlpha = baseAlpha;

  // ---- Build the tapered body outline (a single continuous ribbon that
  // follows the spine, rather than a stack of overlapping circles) ----
  const left = new Array(n), right = new Array(n);
  for(let i=0;i<n;i++){
    const p = segs[i];
    let tx, ty;
    if(i===0){ const q=segs[1]; tx=q.x-p.x; ty=q.y-p.y; }
    else if(i===n-1){ const q=segs[i-1]; tx=p.x-q.x; ty=p.y-q.y; }
    else { const a=segs[i-1], b=segs[i+1]; tx=b.x-a.x; ty=b.y-a.y; }
    const tl = Math.hypot(tx,ty) || 1;
    const nx = -ty/tl, ny = tx/tl;
    const rad = i===0 ? s.headR*0.86 : segmentRadius(s.headR, i, n);
    left[i]  = { x: p.x-camX + nx*rad, y: p.y-camY + ny*rad };
    right[i] = { x: p.x-camX - nx*rad, y: p.y-camY - ny*rad };
  }
  const ea = s.angle;
  const hx = segs[0].x-camX, hy = segs[0].y-camY;
  const nose = { x: hx + Math.cos(ea)*s.headR*0.95, y: hy + Math.sin(ea)*s.headR*0.95 };
  const tail = { x: segs[n-1].x-camX, y: segs[n-1].y-camY };

  // cobra hood flare, drawn behind everything
  if(s.headStyle==='cobra'){
    ctx.fillStyle = s.color;
    ctx.globalAlpha = 0.55*baseAlpha;
    ctx.beginPath();
    ctx.ellipse(hx, hy, s.headR*1.55, s.headR*0.9, ea+Math.PI/2, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = baseAlpha;
  }

  ctx.beginPath();
  ctx.moveTo(nose.x, nose.y);
  ctx.lineTo(left[0].x, left[0].y);
  for(let i=1;i<n;i++){
    const mx=(left[i-1].x+left[i].x)/2, my=(left[i-1].y+left[i].y)/2;
    ctx.quadraticCurveTo(left[i-1].x, left[i-1].y, mx, my);
  }
  ctx.lineTo(left[n-1].x, left[n-1].y);
  ctx.lineTo(tail.x, tail.y);
  ctx.lineTo(right[n-1].x, right[n-1].y);
  for(let i=n-1;i>0;i--){
    const mx=(right[i].x+right[i-1].x)/2, my=(right[i].y+right[i-1].y)/2;
    ctx.quadraticCurveTo(right[i].x, right[i].y, mx, my);
  }
  ctx.lineTo(right[0].x, right[0].y);
  ctx.closePath();

  ctx.fillStyle = s.color;
  ctx.fill();

  // belly shading — a soft darker strip along one edge for depth
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,0.16)';
  ctx.lineWidth = Math.max(2, s.headR*0.55);
  ctx.beginPath();
  ctx.moveTo(right[0].x, right[0].y);
  for(let i=1;i<n;i++) ctx.lineTo(right[i].x, right[i].y);
  ctx.stroke();
  // top highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = Math.max(1.5, s.headR*0.3);
  ctx.beginPath();
  ctx.moveTo(left[0].x, left[0].y);
  for(let i=1;i<n;i++) ctx.lineTo(left[i].x, left[i].y);
  ctx.stroke();
  // scale texture — small dark chevrons across the body at intervals
  ctx.strokeStyle = 'rgba(0,0,0,0.16)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for(let i=2;i<n-1;i+=3){
    ctx.moveTo(left[i].x, left[i].y);
    ctx.lineTo(right[i].x, right[i].y);
  }
  ctx.stroke();
  // mottled blotches — irregular darker patches along the back, stable
  // per-snake (seeded) so the pattern doesn't shimmer frame to frame
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  const blotchStep = Math.max(5, Math.floor(n/7));
  for(let i=3;i<n-3;i+=blotchStep){
    const h = hash2(i*0.37+s.patternSeed, s.patternSeed*1.7+i*0.11);
    if(h<0.42) continue;
    const rad = segmentRadius(s.headR,i,n);
    const p = segs[i];
    ctx.save();
    ctx.translate(p.x-camX, p.y-camY);
    ctx.rotate(ea);
    ctx.beginPath();
    ctx.ellipse(0, 0, rad*0.9, rad*0.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  // fine stipple grain for skin texture
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  for(let i=1;i<n-1;i++){
    const h1 = hash2(i*1.7+s.patternSeed, 3.1+s.patternSeed);
    if(h1<0.8) continue;
    const t = 0.22 + hash2(i*2.3, s.patternSeed)*0.56;
    const px = left[i].x + (right[i].x-left[i].x)*t;
    const py = left[i].y + (right[i].y-left[i].y)*t;
    const rad = Math.max(0.8, segmentRadius(s.headR,i,n)*0.12);
    ctx.beginPath(); ctx.arc(px,py,rad,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // head
  // head-style decoration, drawn behind the eyes (presets only — a photo
  // head is a portrait, it doesn't get a cobra hood etc.)
  const photoReady = s.headStyle==='photo' && s.headImage && s.headImage.complete && s.headImage.naturalWidth>0;
  ctx.beginPath();
  ctx.fillStyle = s.color;
  ctx.arc(hx,hy,s.headR,0,Math.PI*2);
  ctx.fill();

  if(photoReady){
    ctx.save();
    ctx.beginPath();
    ctx.arc(hx,hy,s.headR,0,Math.PI*2);
    ctx.clip();
    const img = s.headImage;
    const scale = Math.max((s.headR*2)/img.naturalWidth, (s.headR*2)/img.naturalHeight);
    const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
    ctx.drawImage(img, hx-dw/2, hy-dh/2, dw, dh);
    ctx.restore();
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(hx,hy,s.headR,0,Math.PI*2); ctx.stroke();
  } else if(s.headStyle==='viper'){
    ctx.save();
    ctx.translate(hx,hy);
    ctx.rotate(ea);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.moveTo(s.headR*0.55,0); ctx.lineTo(0,-s.headR*0.5);
    ctx.lineTo(-s.headR*0.4,0); ctx.lineTo(0,s.headR*0.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  } else if(s.headStyle==='horned'){
    ctx.save();
    ctx.translate(hx,hy);
    ctx.rotate(ea);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.moveTo(-s.headR*0.3,-s.headR*0.75); ctx.lineTo(-s.headR*0.55,-s.headR*1.35); ctx.lineTo(-s.headR*0.05,-s.headR*0.8);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s.headR*0.3, s.headR*0.75); ctx.lineTo(-s.headR*0.55, s.headR*1.35); ctx.lineTo(-s.headR*0.05, s.headR*0.8);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  if(s.invuln>0){
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hx,hy,s.headR+4,0,Math.PI*2); ctx.stroke();
  }

  // eyes — skipped on a photo head, the portrait already has a face
  if(!photoReady){
    // nostrils
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    const n1 = { x: nose.x + Math.cos(ea+1.2)*s.headR*0.35, y: nose.y + Math.sin(ea+1.2)*s.headR*0.35 };
    const n2 = { x: nose.x + Math.cos(ea-1.2)*s.headR*0.35, y: nose.y + Math.sin(ea-1.2)*s.headR*0.35 };
    ctx.beginPath(); ctx.arc(n1.x,n1.y,1.4,0,Math.PI*2); ctx.arc(n2.x,n2.y,1.4,0,Math.PI*2); ctx.fill();

    // eyes — iris + vertical slit pupil, angled slightly forward on top of the head
    const eOff = s.headR*0.52, eFwd = s.headR*0.35;
    const irisR = Math.max(2.4, s.headR*0.24);
    [-1,1].forEach(side=>{
      const exx = hx + Math.cos(ea)*eFwd + Math.cos(ea+side*Math.PI/2)*eOff;
      const eyy = hy + Math.sin(ea)*eFwd + Math.sin(ea+side*Math.PI/2)*eOff;
      ctx.fillStyle = s.boosted ? '#e8fdff' : '#e8c467';
      ctx.beginPath(); ctx.arc(exx,eyy,irisR,0,Math.PI*2); ctx.fill();
      ctx.save();
      ctx.translate(exx,eyy);
      ctx.rotate(ea+Math.PI/2);
      ctx.fillStyle = '#14100a';
      ctx.beginPath(); ctx.ellipse(0,0,irisR*0.32,irisR*0.85,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    // occasional flicking forked tongue
    const cyclePos = (world.time*0.6 + s.tongueSeed) % 3.2;
    if(cyclePos < 0.4){
      const flick = Math.sin((cyclePos/0.4)*Math.PI); // 0 -> 1 -> 0
      const len = s.headR*(1.1)*flick;
      const tx0 = nose.x, ty0 = nose.y;
      const tx1 = nose.x + Math.cos(ea)*len, ty1 = nose.y + Math.sin(ea)*len;
      const forkSpread = 0.35;
      ctx.strokeStyle = '#c23a4a';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(tx0,ty0); ctx.lineTo(tx1,ty1); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(tx1,ty1);
      ctx.lineTo(tx1+Math.cos(ea+forkSpread)*len*0.22, ty1+Math.sin(ea+forkSpread)*len*0.22);
      ctx.moveTo(tx1,ty1);
      ctx.lineTo(tx1+Math.cos(ea-forkSpread)*len*0.22, ty1+Math.sin(ea-forkSpread)*len*0.22);
      ctx.stroke();
    }
  }

  // name tag
  ctx.font = '600 12px -apple-system, Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(234,230,214,0.85)';
  ctx.fillText(s.name, hx, hy - s.headR - 14);

  ctx.restore();
}

function drawFood(){
  for(let i=0;i<food.length;i++){
    const f = food[i];
    const sx = f.x-camX, sy = f.y-camY;
    if(sx<-30-zoomMargin||sx>viewW+30+zoomMargin||sy<-30-zoomMargin||sy>viewH+30+zoomMargin) continue;
    const bob = Math.sin(world.time*2 + f.bob)*1.6;
    const cy = sy+bob;
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 9;
    ctx.beginPath();
    ctx.arc(sx, cy, f.r, 0, Math.PI*2);
    ctx.arc(sx, cy, f.r*0.42, 0, Math.PI*2, true); // inner hole, reversed winding
    ctx.fill('evenodd');
    ctx.shadowBlur = 0;
  }
}

function drawMinimap(){
  mmCtx.clearRect(0,0,104,104);
  mmCtx.save();
  mmCtx.beginPath(); mmCtx.arc(52,52,52,0,Math.PI*2); mmCtx.clip();
  const MINIMAP_BG = { grass:'#233018', rocky:'#2b271f', snow:'#c9d8e2', space:'#0d0a1a' };
  mmCtx.fillStyle = MINIMAP_BG[currentMap] || '#233018';
  mmCtx.fillRect(0,0,104,104);
  const sx = 104/WORLD_W, sy = 104/WORLD_H;
  // obstacles (rocks)
  mmCtx.fillStyle = 'rgba(120,112,100,0.9)';
  for(let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    mmCtx.beginPath();
    mmCtx.arc(o.cx*sx, o.cy*sy, Math.max(1.6, o.boundingR*sx), 0, Math.PI*2);
    mmCtx.fill();
  }
  // viewport rect — reflects the actual visible area, which grows as
  // the camera zooms out (centered on the same point as the on-screen zoom)
  const effW = viewW/camZoom, effH = viewH/camZoom;
  const vx = camX - (effW-viewW)/2, vy = camY - (effH-viewH)/2;
  mmCtx.strokeStyle = 'rgba(234,230,214,0.4)';
  mmCtx.strokeRect(vx*sx, vy*sy, effW*sx, effH*sy);
  // players
  for(let i=0;i<players.length;i++){
    const p = players[i];
    if(!p.alive) continue;
    mmCtx.fillStyle = p.color;
    mmCtx.beginPath();
    mmCtx.arc(p.head.x*sx, p.head.y*sy, p===me?3.2:2.3, 0, Math.PI*2);
    mmCtx.fill();
  }
  mmCtx.restore();
}

function updateBoard(){
  const sorted = players.slice().sort((a,b)=>b.score-a.score);
  const board = document.getElementById('board');
  board.innerHTML = sorted.map(p=>{
    return `<div class="rowScore ${p===me?'me':''}">
      <span class="dot" style="background:${p.color}; color:${p.color}"></span>
      <span class="nm">${p===me?'You':p.name}</span>
      <span class="sc">${p.score}</span>
    </div>`;
  }).join('');
}

function updateToast(dt){

  }

/* ============================== DEATH FLASH ============================== */
const deathFlashEl = document.getElementById('deathFlash');
let myFlash = 0;

/* ============================== GAME LOOP ============================== */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;
  requestAnimationFrame(loop);
  if(!running) return;

  world.time += dt;

  // Left/Right arrow steering: proportional control — tap for a slight
  // nudge, hold for a steady turn — and stop cleanly the instant you
  // release instead of coasting on toward a stale target angle.
  const keyActive = keyState.ArrowLeft || keyState.ArrowRight;
  if(me && me.alive){
    const safeKeyRate = Math.min(KEY_TURN_RATE, maxSafeTurnRate(me));
    if(keyState.ArrowLeft && !keyState.ArrowRight){
      me.angle -= safeKeyRate*dt;
      me.targetAngle = me.angle;
    } else if(keyState.ArrowRight && !keyState.ArrowLeft){
      me.angle += safeKeyRate*dt;
      me.targetAngle = me.angle;
    } else if(keyWasActive){
      me.targetAngle = me.angle; // just released — stop turning immediately
    }
  }
  keyWasActive = keyActive;

  for(let i=0;i<players.length;i++){
    const s = players[i];
    if(!s.alive){
      if(world.time >= s.respawnAt) s.reset();
      continue;
    }
    if(s.isAI) updateAI(s, dt, world);
    s.update(dt, world);
    s.cachedSegs = s.segments();
  }

  updateObstacles(dt);
  checkCollisions();
  checkFood();
  updateBoostSpawn(dt);
  checkBoostPickup();
  updateInvisSpawn(dt);
  checkInvisPickup();
  updateMoles(dt);
  updateCamera(dt);
  updateToast(dt);

  if(me.deathFlash>0){ myFlash = me.deathFlash; }
  if(myFlash>0){
    deathFlashEl.style.opacity = (myFlash*0.35).toFixed(2);
    myFlash -= dt;
  } else {
    deathFlashEl.style.opacity = 0;
  }

  // render — the world layer is wrapped in a zoom transform around screen
  // center (camX/camY already keep the player centered, so this reads as
  // a camera pulling back rather than a re-centered view); UI elements
  // (touch indicator, minimap) are drawn afterward in real screen space.
  ctx.save();
  if(camZoom !== 1){
    ctx.translate(viewW/2, viewH/2);
    ctx.scale(camZoom, camZoom);
    ctx.translate(-viewW/2, -viewH/2);
  }
  drawTerrain(camX,camY);
  drawObstacles(camX,camY);
  drawMoles(camX,camY);
  drawFood();
  drawBoostPickup();
  drawInvisPickup();
  for(let i=0;i<players.length;i++) drawSnake(players[i]);
  ctx.restore();
  drawTouchIndicator();
  drawMinimap();
  updateBoard();
}
requestAnimationFrame(loop);
